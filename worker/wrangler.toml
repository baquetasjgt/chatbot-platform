name = "chatbot-engine"
main = "src/index.js"
compatibility_date = "2026-07-01"

# El widget se importa como texto (src/widget.txt) y se sirve en /widget.js
rules = [
  { type = "Text", globs = ["**/*.txt"], fallthrough = true }
]

# Día 1 de cada mes a las 07:00 UTC: informes automáticos a los clientes
# Cada día a las 07:00 UTC: resumen diario de leads (tenants con lead_notify = daily)
[triggers]
crons = ["0 7 1 * *", "0 7 * * *"]

# Embeddings (@cf/baai/bge-m3) via Workers AI
[ai]
binding = "AI"

# Secretos (con `wrangler secret put`, nunca aquí):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY, ANTHROPIC_API_KEY, ADMIN_TOKEN
#   GEMINI_API_KEY (solo si algún tenant usa provider = 'google')
#   RESEND_API_KEY + EMAIL_FROM (emails: informes y alertas; cuenta gratis en resend.com)
#   ADMIN_ALERT_EMAIL (tu email para avisos de error, máx. 1/hora)
